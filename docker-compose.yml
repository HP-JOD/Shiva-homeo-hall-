version: '3.8'

services:
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_PATH=./database/invoices.db
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./app/backend/src:/app/src
      - ./app/backend/database:/app/database
    command: npm run dev

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./app/frontend/src:/app/src

networks:
  default:
    name: homeo-network
